<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose new password | Biodata Filter</title>
    <meta name="description" content="Choose a new password for Biodata Filter." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page" data-auth-page="update-password">
    <main class="auth-shell">
      <a class="auth-brand" href="/login.html" aria-label="Biodata Filter login">
        <span class="brand-mark">B</span>
        <span><strong>Biodata Filter</strong><small>Private profile search</small></span>
      </a>

      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Account recovery</p>
        <h1 id="auth-title">Choose a new password</h1>
        <p class="auth-intro">Use at least eight characters for your new password.</p>

        <form id="authForm" class="auth-form">
          <label>
            New password
            <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
          </label>
          <label>
            Confirm new password
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password" />
          </label>
          <div id="authStatus" class="auth-status" role="status" hidden></div>
          <button class="auth-submit" type="submit">Update password</button>
        </form>

        <div class="auth-links single-line">
          <a href="/login.html">Return to login</a>
        </div>
      </section>
    </main>
    <script src="auth-page.js" type="module"></script>
  </body>
</html>
