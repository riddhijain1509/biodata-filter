<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Biodata Filter</title>
    <meta name="description" content="Request a password-reset email for Biodata Filter." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page" data-auth-page="forgot-password">
    <main class="auth-shell">
      <a class="auth-brand" href="/login.html" aria-label="Biodata Filter login">
        <span class="brand-mark">B</span>
        <span><strong>Biodata Filter</strong><small>Private profile search</small></span>
      </a>

      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Account recovery</p>
        <h1 id="auth-title">Reset your password</h1>
        <p class="auth-intro">Enter your registered email and we will send a secure reset link.</p>

        <form id="authForm" class="auth-form">
          <label>
            Email
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </label>
          <div id="authStatus" class="auth-status" role="status" hidden></div>
          <button class="auth-submit" type="submit">Send reset link</button>
        </form>

        <div class="auth-links single-line">
          <a href="/login.html">Return to login</a>
        </div>
      </section>
    </main>
    <script src="auth-page.js" type="module"></script>
  </body>
</html>
