<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search profiles | GlobalRistey</title>
    <meta name="description" content="Search approved biodata profiles by age, height, occupation, income, caste, Manglik status, and district." />
    <link rel="stylesheet" href="styles.css?v=20261019-card15" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="GlobalRistey">
        <a class="brand" href="./" aria-label="GlobalRistey home"><div><strong>GlobalRistey</strong></div></a>
        <div class="account-actions" aria-hidden="true"></div>
      </header>
      <section class="workspace">
        <aside class="filters" aria-label="Profile filters">
          <div class="filter-header"><div><p class="eyebrow">Refine results</p><h2>Find your preferences</h2></div><div class="filter-count"><span id="resultCount">0</span><small>matching profiles</small></div><button id="resetBtn" type="button">Reset</button></div>
          <div class="filter-content">
            <div class="filter-section-title">Quick search</div>
            <label class="wide-filter">Name or profile ID<input id="keyword" type="search" placeholder="Search profiles" /></label>
            <div class="filter-section-title">Age and height</div>
            <div class="age-height-row"><label>Age up to<select id="maxAge"><option value="">Any age</option></select></label><label class="height-field">Min height<span class="height-parts"><select id="minHeightFeet" aria-label="Minimum height feet"><option value="">ft</option><option value="4">4 ft</option><option value="5">5 ft</option><option value="6">6 ft</option><option value="7">7 ft</option></select><select id="minHeightInches" aria-label="Minimum height inches"><option value="">in</option><option value="0">0 in</option><option value="1">1 in</option><option value="2">2 in</option><option value="3">3 in</option><option value="4">4 in</option><option value="5">5 in</option><option value="6">6 in</option><option value="7">7 in</option><option value="8">8 in</option><option value="9">9 in</option><option value="10">10 in</option><option value="11">11 in</option></select></span></label><label class="height-field">Max height<span class="height-parts"><select id="maxHeightFeet" aria-label="Maximum height feet"><option value="">ft</option><option value="4">4 ft</option><option value="5">5 ft</option><option value="6">6 ft</option><option value="7">7 ft</option></select><select id="maxHeightInches" aria-label="Maximum height inches"><option value="">in</option><option value="0">0 in</option><option value="1">1 in</option><option value="2">2 in</option><option value="3">3 in</option><option value="4">4 in</option><option value="5">5 in</option><option value="6">6 in</option><option value="7">7 in</option><option value="8">8 in</option><option value="9">9 in</option><option value="10">10 in</option><option value="11">11 in</option></select></span></label></div>
            <div class="filter-section-title">Work and education</div>
            <label>Gender<select id="gender"><option value="">Any gender</option><option value="Female">Female</option><option value="Male">Male</option></select></label>
            <label>Occupation<select id="occupation"><option value="">Any occupation</option><option value="Engineering">Engineering</option><option value="Healthcare">Healthcare</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Management">Management</option><option value="Government">Government</option><option value="Teaching">Teaching</option><option value="Legal">Legal</option><option value="Marketing">Marketing</option><option value="Not Working">Not Working</option><option value="Other">Other</option></select></label>
            <label>Education<select id="education"><option value="">Any education</option></select></label>
            <label>Annual income<select id="incomeBand"><option value="">Any income</option><option value="under15">Less than 15 LPA</option><option value="15to25">Between 15 and 25 LPA</option><option value="over25">More than 25 LPA</option></select></label>
            <div class="filter-section-title">Community</div>
            <label>Caste<select id="caste"><option value="">Any caste</option></select></label><label>Manglik<select id="manglik"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></label>
            <div class="filter-section-title">Location</div>
            <label>Family district<input id="familyDistrict" list="familyDistrictOptions" type="search" placeholder="Any family district" autocomplete="off" /></label>
            <datalist id="familyDistrictOptions"></datalist>
            <label class="last-filter">Posting district<input id="postingDistrict" list="postingDistrictOptions" type="search" placeholder="Any posting district" autocomplete="off" /></label>
            <datalist id="postingDistrictOptions"></datalist>
          </div>
        </aside>
        <section class="results" aria-live="polite"><div class="results-head"><p class="eyebrow">Approved profiles</p></div><div id="resultsList" class="results-list"></div><div id="emptyState" class="empty-state" hidden>No profiles match these filters. Try widening a range or clearing one preference.</div></section>
      </section>
    </main>
    <script src="access-gate.js?v=20261025"></script>
    <script src="app.js?v=20261025-6" type="module"></script>
  </body>
</html>
