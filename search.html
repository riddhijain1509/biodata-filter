<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search profiles | GlobalRistey</title>
    <meta name="description" content="Search approved biodata profiles by age, height, occupation, income, caste, Manglik status, and district." />
    <link rel="stylesheet" href="styles.css?v=20261110-brand-color" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="GlobalRistey">
        <a class="brand" href="./" aria-label="GlobalRistey home"><div><strong>GlobalRistey</strong></div></a>
        <div class="account-actions" aria-hidden="true"></div>
      </header>
      <section class="workspace">
        <aside class="filters" aria-label="Profile filters">
          <div class="filter-header"><div><h2>Matching profiles are</h2></div><div class="filter-count"><span id="resultCount"><strong id="resultCurrent">348</strong><small id="resultTotal" class="count-context">of 348</small></span></div><button id="resetBtn" type="button">Reset</button></div>
          <div class="filter-content">
            <div class="filter-section-title quick-search-title">Feed your choice</div>
            <label class="wide-filter name-filter">By name<input id="keyword" type="search" placeholder="Any" /></label>
            <label class="gender-filter">Gender<select id="gender"><option value="" selected hidden>Choose</option><option value="Female">F</option><option value="Male">M</option></select></label>
            <label class="caste-filter">Caste<select id="caste"><option value="">Any</option><option value="OTHERS">OTHERS</option></select></label>
            <div class="age-height-row"><label>Min age<select id="minAge"><option value="">Any</option></select></label><label>Max age<select id="maxAge"><option value="">Any</option></select></label><label>Min height<select id="minHeight" aria-label="Minimum height"><option value="">Any</option><option value="152.4">5 ft</option><option value="154.94">5 ft 1 in</option><option value="157.48">5 ft 2 in</option><option value="160.02">5 ft 3 in</option><option value="162.56">5 ft 4 in</option><option value="165.1">5 ft 5 in</option><option value="167.64">5 ft 6 in</option><option value="170.18">5 ft 7 in</option><option value="172.72">5 ft 8 in</option><option value="175.26">5 ft 9 in</option><option value="177.8">5 ft 10 in</option><option value="180.34">5 ft 11 in</option><option value="182.88">6 ft</option></select></label></div>
            <label>Education<select id="education"><option value="">Any</option></select></label>
            <label>Occupation<select id="occupation"><option value="">Any</option><option value="Engineering">Engineering</option><option value="Healthcare">Healthcare</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Management">Management</option><option value="Government">Government</option><option value="Teaching">Teaching</option><option value="Legal">Legal</option><option value="Marketing">Marketing</option><option value="Not Working">Not Working</option><option value="Other">Other</option></select></label>
            <label>Income<select id="incomeBand"><option value="">Any</option><option value="1">1 LPA+</option><option value="2">2 LPA+</option><option value="3">3 LPA+</option><option value="4">4 LPA+</option><option value="5">5 LPA+</option><option value="6">6 LPA+</option><option value="7">7 LPA+</option><option value="8">8 LPA+</option><option value="9">9 LPA+</option><option value="10">10 LPA+</option><option value="11">11 LPA+</option><option value="12">12 LPA+</option><option value="13">13 LPA+</option><option value="14">14 LPA+</option><option value="15">15 LPA+</option><option value="16">16 LPA+</option><option value="17">17 LPA+</option><option value="18">18 LPA+</option><option value="19">19 LPA+</option><option value="20">20 LPA+</option><option value="21">21 LPA+</option><option value="22">22 LPA+</option><option value="23">23 LPA+</option><option value="24">24 LPA+</option><option value="25">25 LPA+</option><option value="26">26 LPA+</option><option value="27">27 LPA+</option><option value="28">28 LPA+</option><option value="29">29 LPA+</option><option value="30">30 LPA+</option><option value="31">31 LPA+</option><option value="32">32 LPA+</option><option value="33">33 LPA+</option><option value="34">34 LPA+</option><option value="35">35 LPA+</option><option value="36">36 LPA+</option><option value="37">37 LPA+</option><option value="38">38 LPA+</option><option value="39">39 LPA+</option><option value="40">40 LPA+</option><option value="41">41 LPA+</option><option value="42">42 LPA+</option><option value="43">43 LPA+</option><option value="44">44 LPA+</option><option value="45">45 LPA+</option><option value="46">46 LPA+</option><option value="47">47 LPA+</option><option value="48">48 LPA+</option><option value="49">49 LPA+</option><option value="50">50 LPA+</option><option value="over50">50+ LPA</option></select></label>
            <div class="location-row"><label>Family district<input id="familyDistrict" list="familyDistrictOptions" type="search" placeholder="Any" autocomplete="off" /></label><datalist id="familyDistrictOptions"></datalist><label>Posting district<input id="postingDistrict" list="postingDistrictOptions" type="search" placeholder="Any" autocomplete="off" /></label><datalist id="postingDistrictOptions"></datalist><label class="last-filter">Manglik<select id="manglik"><option value="" selected>No choice</option><option value="yes">Yes</option></select></label></div>
          </div>
        </aside>
        <section class="results" aria-live="polite"><div class="results-head"><p id="approvedProfilesSummary" class="approved-profiles-summary">Your <span id="approvedProfilesCount">348</span> approved profiles are <span class="summary-arrow">↓</span></p></div><div id="resultsList" class="results-list"></div><div id="emptyState" class="empty-state" hidden>No profiles match these filters. Try widening a range or clearing one preference.</div></section>
      </section>
    </main>
    <script src="access-gate.js?v=20261025"></script>
    <script src="app.js?v=20261109-filter-highlight" type="module"></script>
  </body>
</html>
