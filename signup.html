<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | GlobalRistey</title>
    <meta name="description" content="Create an account to search approved biodata profiles." />
    <link rel="stylesheet" href="styles.css?v=20261019-card15" />
  </head>
  <body class="auth-page" data-auth-page="signup">
    <main class="auth-shell">
        <a class="auth-brand" href="./" aria-label="GlobalRistey home">
        <span><strong>GlobalRistey</strong></span>
      </a>

      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Create access</p>
        <h1 id="auth-title">Sign up</h1>
        <p class="auth-intro">Enter your details to explore approved biodata profiles. Your phone is not added to any biodata profile.</p>

        <form id="authForm" class="auth-form">
          <label>
            First name
            <input id="firstName" type="text" autocomplete="given-name" required placeholder="First name" />
          </label>
          <label>
            Last name
            <input id="lastName" type="text" autocomplete="family-name" required placeholder="Last name" />
          </label>
          <label>
            Mobile number
            <span class="phone-row"><select id="countryCode" aria-label="Country code"><option value="+91" selected>+91</option><option value="+1">+1</option><option value="+44">+44</option><option value="+61">+61</option><option value="+971">+971</option></select><input id="mobileNumber" type="tel" autocomplete="tel-national" required inputmode="numeric" placeholder="98765 43210" /></span>
          </label>
          <div id="authStatus" class="auth-status" role="status" hidden></div>
          <button class="auth-submit" type="submit">Continue to profiles</button>
        </form>

        <div class="auth-links single-line">
          <span>Your details are used only to provide access to the profile search.</span>
        </div>
      </section>
    </main>
    <script src="auth-page.js?v=20261025-phone-code" type="module"></script>
  </body>
</html>
