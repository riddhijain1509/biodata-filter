<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | GlobalRistey</title>
    <meta name="description" content="Create an account to search approved biodata profiles." />
    <link rel="stylesheet" href="styles.css?v=20261019-card15" />
  </head>
  <body class="auth-page" data-auth-page="signup">
    <main class="auth-shell">
        <a class="auth-brand" href="./" aria-label="GlobalRistey home">
        <span><strong>GlobalRistey</strong></span>
      </a>

      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Create access</p>
        <h1 id="auth-title">Sign up</h1>
        <p class="auth-intro">Your mobile number belongs to your website account. It is never added to a biodata profile.</p>

        <form id="authForm" class="auth-form">
          <label>
            Email
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </label>
          <label>
            Mobile number
            <input id="mobileNumber" type="tel" autocomplete="tel" required inputmode="tel" placeholder="+91 98765 43210" />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
          </label>
          <label>
            Confirm password
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password" />
          </label>
          <div id="authStatus" class="auth-status" role="status" hidden></div>
          <button class="auth-submit" type="submit">Create account</button>
        </form>

        <div class="auth-links single-line">
          <span>Already registered? <a href="./login.html">Log in</a></span>
        </div>
      </section>
    </main>
    <script src="auth-page.js?v=20261019-auth" type="module"></script>
  </body>
</html>
